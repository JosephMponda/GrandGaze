# Minimal ruff config - catches real issues without blocking on pre-existing noise.
# F401/F841 excluded because ~30 pre-existing instances would mask regressions.
target-version = "py312"
line-length = 120

[lint]
# Keep CI focused on syntax and import/name correctness until the broader style backlog is adopted.
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F841"]
